[package]
name = "rnnoise-mic"
version = "0.1.0"
edition = "2024"
description = "System-wide RNNoise microphone noise suppression with a tray icon (Windows + Linux)"
license = "MIT"
repository = "https://github.com/ardamayk/rnnoise-mic"
readme = "README.md"
keywords = ["rnnoise", "noise-suppression", "microphone", "audio", "tray"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
ctrlc = "3.5.2"
nnnoiseless = { version = "0.5.2", default-features = false }
ringbuf = "0.5.3"
tao = "0.37.1"
tray-icon = "0.26.1"

# Linux: talk to PulseAudio / pipewire-pulse directly (pure Rust, no libpulse-dev needed)
# so we can pick sources by name.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
